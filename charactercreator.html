// ---------- MAIN ----------
function CharacterCreator() {
  const [step, setStep] = useState(0);
  const [concept, setConcept] = useState({ name: "", who: "", want: "", solve: "" });
  const [ancestryIdx, setAncestryIdx] = useState(null);
  const [heritage, setHeritage] = useState("");
  const [humanPicks, setHumanPicks] = useState([]);
  const [ancestryFree, setAncestryFree] = useState(null);
  const [bgIdx, setBgIdx] = useState(null);
  const [bgFree, setBgFree] = useState(null);
  const [classIdx, setClassIdx] = useState(null);
  const [classKey, setClassKey] = useState(null);
  const [ancestryFeat, setAncestryFeat] = useState(null);
  const [classFeat, setClassFeat] = useState(null);
  const [freeBoosts, setFreeBoosts] = useState([]);
  const [skillsChosen, setSkillsChosen] = useState([]);
  const [weapon, setWeapon] = useState(null);
  const [armor, setArmor] = useState(ARMORS[0]);

  const ancestry = ancestryIdx !== null ? ANCESTRIES[ancestryIdx] : null;
  const background = bgIdx !== null ? BACKGROUNDS[bgIdx] : null;
  const cls = classIdx !== null ? CLASSES[classIdx] : null;

  const ancestryAbils = ancestry ? (ancestry.flexible ? humanPicks : ancestry.fixed) : [];

  useEffect(() => { setAncestryFree(null); setHumanPicks([]); setAncestryFeat(null); }, [ancestryIdx]);
  useEffect(() => { setBgFree(null); }, [bgIdx]);
  useEffect(() => { setClassKey(cls && cls.key.length === 1 ? cls.key[0] : null); setClassFeat(null); }, [classIdx]);

  const scores = useMemo(() => {
    const s = { Str: 10, Dex: 10, Con: 10, Int: 10, Wis: 10, Cha: 10 };
    if (ancestry) {
      ancestryAbils.forEach((a) => a && (s[a] = boost(s[a])));
      if (ancestryFree) s[ancestryFree] = boost(s[ancestryFree]);
    }
    if (background) {
      s[background.ability] = boost(s[background.ability]);
      if (bgFree) s[bgFree] = boost(s[bgFree]);
    }
    if (classKey) s[classKey] = boost(s[classKey]);
    freeBoosts.forEach((a) => a && (s[a] = boost(s[a])));
    return s;
  }, [ancestry, ancestryAbils, ancestryFree, background, bgFree, classKey, freeBoosts]);

  const intMod = mod(scores.Int);
  const skillPool = cls ? Math.max(0, cls.baseSkills + intMod) : 0;
  const preTrained = new Set([background?.skill, cls?.auto].filter(Boolean));
  const totalTrained = skillPool + preTrained.size;

  const hp = ancestry && cls ? ancestry.hp + cls.hp + mod(scores.Con) : null;
  const acItem = armor ? armor.bonus : 0;
  const dexForAc = armor ? Math.min(mod(scores.Dex), armor.cap) : mod(scores.Dex);
  const ac = 10 + dexForAc + 3 + acItem;
  const perception = 3 + mod(scores.Wis);
  const fort = 3 + mod(scores.Con);
  const reflex = 3 + mod(scores.Dex);
  const will = 3 + mod(scores.Wis);
  const keyMod = classKey ? mod(scores[classKey]) : 0;
  const classDC = 10 + 3 + keyMod;

  const canAdvance = [
    concept.who.trim().length > 0,
    ancestry && (ancestry.flexible ? humanPicks.length === 2 : true) && ancestryFree,
    background && bgFree,
    cls && classKey,
    ancestryFeat && classFeat,
    freeBoosts.filter(Boolean).length === 4 && new Set(freeBoosts).size === 4,
    skillsChosen.length === skillPool,
    true,
    true,
  ][step];

  const next = () => setStep((s) => Math.min(STEPS.length - 1, s + 1));
  const back = () => setStep((s) => Math.max(0, s - 1));
  const restart = () => {
    setStep(0); setConcept({ name: "", who: "", want: "", solve: "" });
    setAncestryIdx(null); setHeritage(""); setHumanPicks([]); setAncestryFree(null);
    setBgIdx(null); setBgFree(null); setClassIdx(null); setClassKey(null);
    setAncestryFeat(null); setClassFeat(null);
    setFreeBoosts([]); setSkillsChosen([]); setWeapon(null); setArmor(ARMORS[0]);
  };

  const toggleFreeBoost = (a) => {
    setFreeBoosts((prev) => {
      if (prev.includes(a)) return prev.filter((x) => x !== a);
      if (prev.length >= 4) return prev;
      return [...prev, a];
    });
  };

  const toggleSkill = (s) => {
    setSkillsChosen((prev) => {
      if (prev.includes(s)) return prev.filter((x) => x !== s);
      if (prev.length >= skillPool) return prev;
      return [...prev, s];
    });
  };

  const featTraitPool = [...(ancestry?.feats.flatMap((f) => f.traits) || []), ...(cls?.feats.flatMap((f) => f.traits) || [])];
  const weaponTraitPool = WEAPONS.flatMap((w) => w.traits);

  // Printable sheet derived values
  const trainedSet = new Set([...preTrained, ...skillsChosen]);
  const skillRows = SKILLS.map((s) => {
    const ab = SKILL_ABIL[s];
    const trained = trainedSet.has(s);
    return { name: s, ability: ab, trained, val: (trained ? 3 : 0) + mod(scores[ab]) };
  });
  const size = ancestry ? ANCESTRY_SIZE[ancestry.name] : "Medium";
  const isRanged = weapon && ["Shortbow", "Longbow"].includes(weapon.name);
  const useDexToHit = weapon && (isRanged || (weapon.traits.includes("Finesse") && mod(scores.Dex) > mod(scores.Str)));
  const atkAbilMod = weapon ? mod(scores[useDexToHit ? "Dex" : "Str"]) : 0;
  const atkBonus = weapon ? 3 + atkAbilMod : null;
  const dmgBonus = weapon ? (isRanged ? 0 : atkAbilMod) : null;
  const [dmgDie, dmgType] = weapon ? weapon.dmg.split(" ") : ["", ""];

  return (
    <div style={{
      "--bg": "#161B22", "--panel": "#1F2733", "--panel2": "#26303D", "--text": "#E7E2D3",
      "--dim": "#93A0AC", "--ember": "#CB6843", "--sky": "#6F9BB0", "--gold": "#C7A15D", "--border": "#333F4E",
      "--serif": "'Iowan Old Style','Palatino Linotype',Georgia,serif",
      "--sans": "'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif",
      background: "var(--bg)", color: "var(--text)", fontFamily: "var(--sans)",
      minHeight: "100vh", padding: "16px 14px 90px", maxWidth: 480, margin: "0 auto", position: "relative", boxSizing: "border-box",
    }}>
      <style>{`
        @media print {
          body { background: #fff !important; }
          .no-print { display: none !important; }
          .sheet-wrap { box-shadow: none !important; padding: 0 !important; }
          .sheet-page { border: none !important; }
          @page { size: letter; margin: 0.4in; }
        }
      `}</style>
      <div className="no-print" style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, letterSpacing: 0.4, color: "var(--sky)" }}>The Wyrmfall Accord</div>
        <div style={{ fontFamily: "var(--serif)", fontSize: 26, marginTop: 2 }}>Charting Your Path</div>
      </div>

      <div className="no-print" style={{ display: "flex", overflowX: "auto", gap: 6, marginBottom: 18, paddingBottom: 4 }}>
        {STEPS.map((s, i) => {
          const done = i < step, current = i === step;
          return (
            <button key={s.key} onClick={() => i <= step && setStep(i)}
              style={{
                flex: "0 0 auto", display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                background: "none", border: "none", cursor: i <= step ? "pointer" : "default", padding: "2px 6px",
                opacity: i > step ? 0.4 : 1,
              }}>
              <div style={{
                width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                background: current ? "var(--ember)" : done ? "var(--gold)" : "var(--panel2)",
                border: `1px solid ${current || done ? "transparent" : "var(--border)"}`, fontSize: 14,
              }}>
                {done ? <span style={{ color: "#161B22" }}>✓</span> : <span>{s.icon}</span>}
              </div>
              <span style={{ fontSize: 9, color: current ? "var(--text)" : "var(--dim)", whiteSpace: "nowrap" }}>{s.label}</span>
            </button>
          );
        })}
      </div>

      {step === 0 && (
        <Card>
          <SectionLabel>Who are they, before the rulebook?</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>Three questions point you toward everything else.</p>
          <label style={{ fontSize: 12.5, color: "var(--sky)" }}>Character name</label>
          <input value={concept.name} onChange={(e) => setConcept({ ...concept, name: e.target.value })}
            placeholder="What do they go by?" style={inputStyle} />
          <label style={{ fontSize: 12.5, color: "var(--sky)" }}>Who are they? Where from, what did they do before Hollow's Reach?</label>
          <textarea value={concept.who} onChange={(e) => setConcept({ ...concept, who: e.target.value })}
            placeholder="One or two sentences..." style={{ ...inputStyle, height: 64, resize: "vertical" }} />
          <label style={{ fontSize: 12.5, color: "var(--sky)" }}>What do they want?</label>
          <textarea value={concept.want} onChange={(e) => setConcept({ ...concept, want: e.target.value })}
            placeholder="Fortune, a lost relative, redemption, a name for themselves..." style={{ ...inputStyle, height: 52, resize: "vertical" }} />
          <label style={{ fontSize: 12.5, color: "var(--sky)" }}>How do they solve problems?</label>
          <textarea value={concept.solve} onChange={(e) => setConcept({ ...concept, solve: e.target.value })}
            placeholder="Combat-first, talk-first, sneak-first, something in between..." style={{ ...inputStyle, height: 52, resize: "vertical" }} />
        </Card>
      )}

      {step === 1 && (
        <Card>
          <SectionLabel>Ancestry & Heritage</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>Sets your base ability boosts, HP, and Speed.</p>
          {ANCESTRIES.map((a, i) => (
            <Pill key={a.name} active={ancestryIdx === i} onClick={() => setAncestryIdx(i)}
              sub={`${a.flavor}${a.hook ? " — " + a.hook : ""} · Speed ${a.speed}ft · +${a.hp} HP`}>
              {a.name}
            </Pill>
          ))}
          {ancestry && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
              <label style={{ fontSize: 12.5, color: "var(--sky)" }}>Heritage (flavor — a clan, tradition, or variant within {ancestry.name})</label>
              <input value={heritage} onChange={(e) => setHeritage(e.target.value)} placeholder="e.g. Rock Dwarf, Hill Halfling..." style={inputStyle} />

              {ancestry.flexible ? (
                <>
                  <div style={{ fontSize: 12.5, color: "var(--sky)", marginTop: 6, marginBottom: 6 }}>Pick 2 flexible boosts</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {ABILS.map((a) => (
                      <Chip key={a} active={humanPicks.includes(a)} onClick={() => {
                        setHumanPicks((prev) => prev.includes(a) ? prev.filter(x => x !== a) : prev.length < 2 ? [...prev, a] : prev);
                      }}>{a}</Chip>
                    ))}
                  </div>
                </>
              ) : (
                <div style={{ fontSize: 13, color: "var(--dim)", margin: "6px 0" }}>Fixed boosts: <b style={{ color: "var(--text)" }}>{ancestry.fixed.map(a => ABIL_NAME[a]).join(", ")}</b></div>
              )}

              <div style={{ fontSize: 12.5, color: "var(--sky)", marginTop: 10, marginBottom: 6 }}>Free boost (any ability not already boosted above)</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {ABILS.filter(a => !ancestryAbils.includes(a)).map((a) => (
                  <Chip key={a} active={ancestryFree === a} onClick={() => setAncestryFree(a)}>{a}</Chip>
                ))}
              </div>
            </div>
          )}
        </Card>
      )}

      {step === 2 && (
        <Card>
          <SectionLabel>Background</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>What they did before adventuring. Grants two ability boosts, one trained skill, one skill feat.</p>
          {BACKGROUNDS.map((b, i) => (
            <Pill key={b.name} active={bgIdx === i} onClick={() => setBgIdx(i)}
              sub={`${b.fit} · Trained: ${b.skill} · Boost: ${ABIL_NAME[b.ability]}`}>
              {b.name}
            </Pill>
          ))}
          {background && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
              <div style={{ fontSize: 12.5, color: "var(--sky)", marginBottom: 6 }}>Free boost (any ability except {ABIL_NAME[background.ability]})</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {ABILS.filter(a => a !== background.ability).map((a) => (
                  <Chip key={a} active={bgFree === a} onClick={() => setBgFree(a)}>{a}</Chip>
                ))}
              </div>
            </div>
          )}
        </Card>
      )}

      {step === 3 && (
        <Card>
          <SectionLabel>Class</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>Your core role. This drives your key ability boost and most of your skill count.</p>
          {CLASSES.map((c, i) => (
            <Pill key={c.name} active={classIdx === i} onClick={() => setClassIdx(i)}
              sub={`${c.role} · Key: ${c.key.map(k => ABIL_NAME[k]).join(" or ")} · HP/lvl ${c.hp}${c.auto ? " · Auto-trained: " + c.auto : ""}`}>
              {c.name}
            </Pill>
          ))}
          {cls && cls.key.length > 1 && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
              <div style={{ fontSize: 12.5, color: "var(--sky)", marginBottom: 6 }}>Choose your key ability</div>
              <div style={{ display: "flex", gap: 6 }}>
                {cls.key.map((k) => <Chip key={k} active={classKey === k} onClick={() => setClassKey(k)}>{ABIL_NAME[k]}</Chip>)}
              </div>
            </div>
          )}
        </Card>
      )}

      {step === 4 && (
        <Card>
          <SectionLabel>Feats</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>
            At level 1 you gain one <b style={{ color: "var(--text)" }}>Ancestry feat</b> and one <b style={{ color: "var(--text)" }}>Class feat</b>. Every feat belongs to exactly one category — check it before you pick. Names and effects here are illustrative; confirm exact wording against your rulebook or Pathbuilder.
          </p>

          {!ancestry || !cls ? (
            <div style={{ fontSize: 13.5, color: "var(--dim)", padding: "10px 0" }}>Pick an Ancestry and a Class first — their feats will show up here.</div>
          ) : (
            <>
              <div style={{ fontFamily: "var(--serif)", fontSize: 16, marginBottom: 8 }}>Ancestry feat — {ancestry.name}</div>
              {ancestry.feats.map((f) => (
                <FeatCard key={f.name} feat={f} active={ancestryFeat?.name === f.name} onClick={() => setAncestryFeat(f)} />
              ))}

              <div style={{ fontFamily: "var(--serif)", fontSize: 16, marginTop: 16, marginBottom: 8 }}>Class feat — {cls.name}</div>
              {cls.feats.map((f) => (
                <FeatCard key={f.name} feat={f} active={classFeat?.name === f.name} onClick={() => setClassFeat(f)} />
              ))}

              <TraitGlossary traits={featTraitPool} />

              <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
                <div style={{ fontSize: 12.5, color: "var(--sky)", marginBottom: 8 }}>What's still ahead (levels 2–10)</div>
                {FEAT_LEVELS.slice(1).map((f) => (
                  <div key={f.lvl} style={{ display: "flex", gap: 10, fontSize: 12.5, padding: "5px 0", borderBottom: "1px solid var(--border)" }}>
                    <span style={{ color: "var(--gold)", width: 18, flexShrink: 0 }}>{f.lvl}</span>
                    <span style={{ color: "var(--dim)" }}>{f.gains}</span>
                  </div>
                ))}
                <div style={{ fontSize: 11.5, color: "var(--dim)", marginTop: 8, lineHeight: 1.5 }}>
                  Skill feats need Trained proficiency in the relevant skill; General feats are open to anyone. Re-check the category a feat asks for every time you level up.
                </div>
              </div>
            </>
          )}
        </Card>
      )}

      {step === 5 && (
        <Card>
          <SectionLabel>Ability Scores</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>
            Four free boosts, assigned to four <i>different</i> abilities in this batch. Ancestry, background, and class boosts are already applied.
          </p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
            {ABILS.map((a) => (
              <Chip key={a} active={freeBoosts.includes(a)} onClick={() => toggleFreeBoost(a)}
                disabled={!freeBoosts.includes(a) && freeBoosts.length >= 4}>{a}</Chip>
            ))}
          </div>
          <div style={{ fontSize: 12, color: "var(--dim)", marginBottom: 10 }}>{freeBoosts.length}/4 selected</div>
          <div style={{ borderTop: "1px solid var(--border)", paddingTop: 8 }}>
            {ABILS.map((a) => <AbilRow key={a} code={a} score={scores[a]} />)}
          </div>
        </Card>
      )}

      {step === 6 && (
        <Card>
          <SectionLabel>Skills</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 8 }}>
            {cls?.name || "Your class"}'s base skills ({cls?.baseSkills ?? "–"}) + Intelligence mod ({fmtMod(intMod)}) = <b style={{ color: "var(--text)" }}>{skillPool}</b> to pick freely.
          </p>
          {preTrained.size > 0 && (
            <p style={{ fontSize: 13, color: "var(--gold)", marginBottom: 12 }}>
              Already trained automatically: {[...preTrained].join(", ")}
            </p>
          )}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {SKILLS.filter(s => !preTrained.has(s)).map((s) => (
              <Chip key={s} active={skillsChosen.includes(s)} onClick={() => toggleSkill(s)}
                disabled={!skillsChosen.includes(s) && skillsChosen.length >= skillPool}>{s}</Chip>
            ))}
          </div>
          <div style={{ fontSize: 12, color: "var(--dim)", marginTop: 12 }}>{skillsChosen.length}/{skillPool} selected · {totalTrained} trained total with automatics</div>
        </Card>
      )}

      {step === 7 && (
        <Card>
          <SectionLabel>Gear</SectionLabel>
          <p style={{ color: "var(--dim)", fontSize: 13.5, marginTop: 2, marginBottom: 14 }}>Starting wealth: 15 gp. Don't overthink it — treasure earned in play covers the rest.</p>
          <div style={{ fontSize: 12.5, color: "var(--sky)", marginBottom: 6 }}>Primary weapon</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
            {WEAPONS.map((w) => (
              <Chip key={w.name} active={weapon?.name === w.name} onClick={() => setWeapon(w)}>{w.name}</Chip>
            ))}
          </div>
          {weapon && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: "var(--dim)" }}>{weapon.dmg}</span>
              {weapon.traits.map((t) => <TraitTag key={t} t={t} />)}
              {weapon.traits.length === 0 && <span style={{ fontSize: 12, color: "var(--dim)" }}>No special traits</span>}
            </div>
          )}
          <div style={{ fontSize: 12.5, color: "var(--sky)", marginBottom: 6 }}>Armor</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {ARMORS.map((a) => (
              <Chip key={a.name} active={armor?.name === a.name} onClick={() => setArmor(a)}>{a.name}</Chip>
            ))}
          </div>
          <div style={{ fontSize: 13, color: "var(--dim)", marginTop: 16, lineHeight: 1.6 }}>
            Plus: an adventurer's pack (rope, rations, bedroll, waterskin, flint & steel), and any class-specific essentials (spellbook, holy symbol, thieves' tools) — grab those in your rulebook.
          </div>
          <TraitGlossary traits={weaponTraitPool} />
        </Card>
      )}

      {step === 8 && (
        <div>
          <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <button onClick={() => window.print()} style={{
              flex: 1, padding: "12px", borderRadius: 12, border: "none", background: "var(--ember)", color: "#161B22",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontWeight: 600, cursor: "pointer", fontSize: 13.5,
            }}>
              <span>🖨</span> Print Character Sheet
            </button>
          </div>

          <div className="sheet-wrap" style={{ background: "#fff", borderRadius: 10, padding: 14, marginBottom: 12 }}>
            <div className="sheet-page" style={{ border: "2px solid #111", borderRadius: 4, padding: 14, color: "#111", fontFamily: "Helvetica, Arial, sans-serif" }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "2px solid #111", paddingBottom: 8, marginBottom: 10, gap: 10 }}>
                <div>
                  <div style={{ fontSize: 20, fontWeight: 700 }}>{concept.name || "Unnamed Character"}</div>
                  <div style={{ fontSize: 10.5, color: "#555" }}>The Wyrmfall Accord · Level 1</div>
                </div>
                <div style={{ textAlign: "right", fontSize: 10.5, lineHeight: 1.6 }}>
                  <div>Ancestry: <b>{ancestry?.name || "—"}{heritage ? ` (${heritage})` : ""}</b></div>
                  <div>Size: <b>{size}</b> · Background: <b>{background?.name || "—"}</b></div>
                  <div>Class: <b>{cls?.name || "—"}</b></div>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6, marginBottom: 10 }}>
                {ABILS.map((a) => (
                  <div key={a} style={boxStyle}>
                    <div style={labelStyle}>{a.toUpperCase()}</div>
                    <div style={bigValStyle}>{fmtMod(mod(scores[a]))}</div>
                    <div style={{ fontSize: 9, color: "#777" }}>{scores[a]}</div>
                  </div>
                ))}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 8 }}>
                <div style={boxStyle}><div style={labelStyle}>Perception</div><div style={bigValStyle}>{fmtMod(perception)}</div></div>
                <div style={boxStyle}><div style={labelStyle}>Class DC</div><div style={bigValStyle}>{classDC}</div></div>
                <div style={boxStyle}><div style={labelStyle}>Speed</div><div style={bigValStyle}>{ancestry?.speed ?? "—"} ft</div></div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1.3fr", gap: 8, marginBottom: 8 }}>
                <div style={boxStyle}><div style={labelStyle}>Fortitude</div><div style={bigValStyle}>{fmtMod(fort)}</div></div>
                <div style={boxStyle}><div style={labelStyle}>Reflex</div><div style={bigValStyle}>{fmtMod(reflex)}</div></div>
                <div style={boxStyle}><div style={labelStyle}>Will</div><div style={bigValStyle}>{fmtMod(will)}</div></div>
                <div style={boxStyle}><div style={labelStyle}>Armor Class</div><div style={bigValStyle}>{ac}</div></div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
                <div style={boxStyle}><div style={labelStyle}>HP Max</div><div style={bigValStyle}>{hp}</div></div>
                <div style={boxStyle}><div style={labelStyle}>HP Current</div><div style={{ ...bigValStyle, color: "#bbb" }}>____</div></div>
                <div style={boxStyle}><div style={labelStyle}>Temp HP</div><div style={{ ...bigValStyle, color: "#bbb" }}>____</div></div>
              </div>

              <div style={{ fontSize: 11, fontWeight: 700, borderBottom: "1px solid #111", marginBottom: 4, paddingBottom: 2 }}>SKILLS</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px", marginBottom: 14, fontSize: 11 }}>
                {skillRows.map((r) => (
                  <div key={r.name} style={{ display: "flex", justifyContent: "space-between", padding: "2px 0", borderBottom: "1px dotted #999" }}>
                    <span>{r.trained ? "●" : "○"} {r.name} <span style={{ color: "#888" }}>({r.ability})</span></span>
                    <b>{fmtMod(r.val)}</b>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", padding: "2px 0", borderBottom: "1px dotted #999" }}>
                  <span>○ Lore: __________ <span style={{ color: "#888" }}>(Int)</span></span>
                  <b>{fmtMod(intMod)}</b>
                </div>
              </div>

              <div style={{ fontSize: 11, fontWeight: 700, borderBottom: "1px solid #111", marginBottom: 4, paddingBottom: 2 }}>STRIKES</div>
              <table style={{ width: "100%", fontSize: 11, borderCollapse: "collapse", marginBottom: 14 }}>
                <thead>
                  <tr style={{ textAlign: "left", borderBottom: "1px solid #111" }}>
                    <th style={{ padding: "2px 4px 4px 0" }}>Weapon</th>
                    <th style={{ padding: "2px 4px 4px 0" }}>Attack</th>
                    <th style={{ padding: "2px 4px 4px 0" }}>Damage</th>
                    <th style={{ padding: "2px 4px 4px 0" }}>Traits</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style={{ borderBottom: "1px dotted #999" }}>
                    <td style={{ padding: "4px 4px 4px 0" }}>{weapon?.name || "—"}</td>
                    <td style={{ padding: "4px 4px 4px 0" }}>{weapon ? fmtMod(atkBonus) : "—"}</td>
                    <td style={{ padding: "4px 4px 4px 0" }}>{weapon ? `${dmgDie}${dmgBonus ? fmtMod(dmgBonus) : ""} ${dmgType}` : "—"}</td>
                    <td style={{ padding: "4px 4px 4px 0" }}>{weapon ? (weapon.traits.join(", ") || "—") : "—"}</td>
                  </tr>
                  <tr><td colSpan={4} style={{ color: "#ccc", padding: "8px 0 2px" }}>_______________________________________</td></tr>
                </tbody>
              </table>

              <div style={{ fontSize: 11, fontWeight: 700, borderBottom: "1px solid #111", marginBottom: 4, paddingBottom: 2 }}>FEATS &amp; FEATURES</div>
              <div style={{ fontSize: 11, marginBottom: 14, lineHeight: 1.5 }}>
                <div><b>Ancestry —</b> {ancestryFeat ? `${ancestryFeat.name}: ${ancestryFeat.desc}` : "—"}</div>
                <div><b>Class —</b> {classFeat ? `${classFeat.name}: ${classFeat.desc}` : "—"}</div>
                <div style={{ color: "#999" }}><b>Skill —</b> gained at level 2</div>
                <div style={{ color: "#999" }}><b>General —</b> gained at level 3</div>
              </div>

              <div style={{ fontSize: 11, fontWeight: 700, borderBottom: "1px solid #111", marginBottom: 4, paddingBottom: 2 }}>GEAR &amp; MONEY</div>
              <div style={{ fontSize: 11, marginBottom: concept.want ? 10 : 0 }}>
                {armor?.name || "No armor"}, adventurer's pack (rope, rations, bedroll, waterskin, flint &amp; steel), 15 gp starting wealth (minus purchases)
              </div>

              {concept.want && (
                <div style={{ fontSize: 10.5, fontStyle: "italic", color: "#555", borderTop: "1px solid #111", paddingTop: 6 }}>
                  "{concept.want}"
                </div>
              )}
            </div>
          </div>

          <div className="no-print" style={{ fontSize: 11, color: "var(--dim)", marginBottom: 12, lineHeight: 1.5 }}>
            Simplified totals: flat Trained proficiency throughout, and Strikes assume Trained weapon proficiency. Some classes start Expert in a save or Perception at level 1 — check your class table and adjust by hand before play.
          </div>

          <button className="no-print" onClick={restart} style={{
            width: "100%", padding: "12px", borderRadius: 12, background: "none",
            border: "1px solid var(--border)", color: "var(--dim)", display: "flex", alignItems: "center",
            justifyContent: "center", gap: 6, fontSize: 13.5, cursor: "pointer",
          }}>
            <span>↺</span> Start a new character
          </button>
        </div>
      )}

      <div className="no-print" style={{
        position: "fixed", bottom: 0, left: 0, right: 0, background: "linear-gradient(to top, var(--bg) 70%, transparent)",
        padding: "18px 14px 14px", display: "flex", gap: 10, maxWidth: 480, margin: "0 auto",
      }}>
        <button onClick={back} disabled={step === 0} style={{
          flex: "0 0 auto", padding: "12px 16px", borderRadius: 12, border: "1px solid var(--border)",
          background: "var(--panel)", color: step === 0 ? "var(--dim)" : "var(--text)", display: "flex", alignItems: "center", gap: 4,
          cursor: step === 0 ? "default" : "pointer", opacity: step === 0 ? 0.5 : 1,
        }}>
          <span>‹</span> Back
        </button>
        {step < STEPS.length - 1 ? (
          <button onClick={next} disabled={!canAdvance} style={{
            flex: 1, padding: "12px 16px", borderRadius: 12, border: "none",
            background: canAdvance ? "var(--ember)" : "var(--panel2)", color: canAdvance ? "#161B22" : "var(--dim)",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontWeight: 600,
            cursor: canAdvance ? "pointer" : "default",
          }}>
            Next <span>›</span>
          </button>
        ) : (
          <div style={{ flex: 1, textAlign: "center", padding: "12px", color: "var(--gold)", fontSize: 13.5, fontFamily: "var(--serif)" }}>
            Ready for Hollow's Reach.
          </div>
        )}
      </div>
    </div>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 10, border: "1px solid #333F4E",
  background: "#26303D", color: "#E7E2D3", fontFamily: "inherit", fontSize: 14, marginTop: 4, marginBottom: 12, outline: "none",
};

const Chip = ({ active, onClick, children, disabled }) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding: "8px 14px", borderRadius: 999, border: `1px solid ${active ? "var(--ember)" : "var(--border)"}`,
    background: active ? "var(--ember)" : "var(--panel2)", color: active ? "#161B22" : disabled ? "var(--dim)" : "var(--text)",
    fontSize: 13, cursor: disabled ? "default" : "pointer", opacity: disabled ? 0.45 : 1, fontWeight: active ? 600 : 400,
  }}>{children}</button>
);

const StatLine = ({ label, value }) => (
  <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--border)", fontSize: 14 }}>
    <span style={{ color: "var(--dim)" }}>{label}</span>
    <span style={{ fontFamily: "var(--serif)" }}>{value}</span>
  </div>
);

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CharacterCreator />);
</script>
</body>
</html>
